repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.2.2
    hooks:
      - id: sqlfluff-lint
        files: ^include/transforms/models/.*\.sql$
        additional_dependencies:
          - dbt-duckdb
          - sqlfluff-templater-dbt==4.2.2
