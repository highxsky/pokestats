models:
  - name: int_moves_per_pokemon
    description: One row per (Pokémon, move) bridge linking Pokémon to the moves they can learn.
    columns:
      - name: pokemon_move_id
        data_type: VARCHAR
        description: '{{ doc("pokemon_move_id") }}'
        tests:
          - unique
          - not_null
      - name: poke_id
        data_type: INTEGER
        description: '{{ doc("poke_id") }}'
        tests:
          - not_null
      - name: move_id
        data_type: INTEGER
        description: '{{ doc("move_id") }}'
        tests:
          - not_null
sources: []
seeds: []
