models:
  - name: int_past_stats
    description: One row per (Pokémon, generation, stat) recorded in the past-stats changelog.
    columns:
      - name: past_stat_id
        data_type: VARCHAR
        description: Surrogate key for a pokemon's past stat
        tests:
          - unique
          - not_null
      - name: fetch_date
        data_type: TIMESTAMP
        description: '{{ doc("fetch_date") }}'
        tests:
          - not_null
      - name: poke_id
        data_type: INTEGER
        description: '{{ doc("poke_id") }}'
        tests:
          - not_null
      - name: gen_id
        data_type: INTEGER
        description: '{{ doc("gen_id") }}'
        tests:
          - not_null
      - name: stat_name
        data_type: VARCHAR
        description: '{{ doc("stat_name") }}'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [hp, attack, defense, special, special-attack, special-defense, speed]
      - name: stat_value
        data_type: INTEGER
        description: '{{ doc("stat_value") }}'
        tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 255
sources: []
seeds: []
