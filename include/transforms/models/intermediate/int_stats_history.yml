version: 2
models:
  - name: int_stats_history
    tests:
      - dbt_utils.mutually_exclusive_ranges:
          arguments:
            lower_bound_column: valid_from_gen
            upper_bound_column: coalesce(valid_to_gen, 999)
            partition_by: poke_id, stat_name
            gaps: required
            zero_length_range_allowed: true
    columns:
      - name: stat_id
        data_type: VARCHAR
        description: >-
          Surrogate key for a pokemon's stat validity interval,
          built from (poke_id, stat_name, valid_from_gen)
        tests:
          - unique
          - not_null
      - name: fetch_date
        data_type: TIMESTAMP
        description: '{{ doc("fetch_date") }}'
        tests:
          - not_null
      - name: poke_id
        data_type: INTEGER
        description: '{{ doc("poke_id") }}'
        tests:
          - not_null
      - name: stat_name
        data_type: VARCHAR
        description: A pokemon's stat name (e.g. attack, speed)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [hp, attack, defense, special, special-attack, special-defense, speed]
      - name: stat_value
        data_type: INTEGER
        description: A pokemon's stat value (e.g. 85)
        tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 255
      - name: valid_from_gen
        data_type: INTEGER
        description: '{{ doc("valid_from_gen") }}'
        tests:
          - not_null
      - name: valid_to_gen
        data_type: INTEGER
        description: '{{ doc("valid_to_gen") }}'
sources: []
seeds: []
