models:
  - name: int_type_history
    description: >-
      One row per (Pokémon, slot, validity interval). Combines current types with the
      past-types changelog into generation-ranged validity windows.
    tests:
      - dbt_utils.mutually_exclusive_ranges:
          arguments:
            lower_bound_column: valid_from_gen
            upper_bound_column: coalesce(valid_to_gen, 999)
            partition_by: poke_id, slot
            gaps: required
            zero_length_range_allowed: true
    columns:
      - name: type_id
        data_type: VARCHAR
        description: '{{ doc("type_id") }}'
        tests:
          - unique
          - not_null
      - name: fetch_date
        data_type: TIMESTAMP
        description: '{{ doc("fetch_date") }}'
        tests:
          - not_null
      - name: poke_id
        data_type: INTEGER
        description: '{{ doc("poke_id") }}'
        tests:
          - not_null
      - name: slot
        data_type: INTEGER
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
        description: '{{ doc("slot") }}'
      - name: type_name
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [normal, fire, water, electric, grass, ice, fighting,
                         poison, ground, flying, psychic, bug, rock, ghost,
                         dragon, dark, steel, fairy]
        description: '{{ doc("type_name") }}'
      - name: valid_from_gen
        data_type: INTEGER
        description: '{{ doc("valid_from_gen") }}'
        tests:
          - not_null
      - name: valid_to_gen
        data_type: INTEGER
        description: '{{ doc("valid_to_gen") }}'
sources: []
seeds: []
