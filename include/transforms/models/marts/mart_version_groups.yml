models:
  - name: mart_version_groups
    description: One row per version group with its generation
    columns:
      - name: version_group_id
        data_type: INTEGER
        description: '{{ doc("version_group_id") }}'
        tests:
          - unique
          - not_null
      - name: version_group_name
        data_type: VARCHAR
        description: '{{ doc("version_group_name") }}'
        tests:
          - not_null
      - name: poke_gen
        data_type: INTEGER
        description: '{{ doc("poke_gen") }}'
        tests:
          - not_null
sources: []
seeds: []
