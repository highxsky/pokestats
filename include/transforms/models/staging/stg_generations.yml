models:
  - name: stg_generations
    columns:
      - name: fetch_date
        data_type: TIMESTAMP
        description: '{{ doc("fetch_date") }}'
        tests:
          - not_null
      - name: gen_id
        data_type: INTEGER
        description: '{{ doc("gen_id") }}'
        tests:
          - unique
          - not_null
      - name: gen_api_name
        data_type: VARCHAR
        description: The generation's API name (e.g. generation-i)
        tests:
          - not_null
      - name: gen_name
        data_type: VARCHAR
        description: '{{ doc("gen_name") }}'
        tests:
          - not_null
sources: []
seeds: []
