version: 2
models:
  - name: stg_move_details
    columns:
      - name: fetch_date
        description: '{{ doc("fetch_date") }}'
        data_type: TIMESTAMP
        tests:
          - not_null
      - name: move_id
        description: '{{ doc("move_id") }}'
        data_type: INTEGER
        tests:
          - unique
          - not_null
      - name: move_name
        description: '{{ doc("move_name") }}'
        data_type: VARCHAR
        tests:
          - not_null
      - name: power
        description: '{{ doc("power") }}'
        data_type: INTEGER
      - name: accuracy
        description: '{{ doc("accuracy") }}'
        data_type: INTEGER
      - name: pp
        description: '{{ doc("pp") }}'
        data_type: INTEGER
        tests:
          - not_null
      - name: priority
        description: '{{ doc("priority") }}'
        data_type: INTEGER
        tests:
          - not_null
      - name: type_name
        description: '{{ doc("type_name") }}'
        data_type: VARCHAR
        tests:
          - not_null
      - name: damage_class
        description: '{{ doc("damage_class") }}'
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [physical, special, status]
      - name: gen_id
        description: '{{ doc("gen_id") }}'
        data_type: INTEGER
        tests:
          - not_null
sources: []
seeds: []
