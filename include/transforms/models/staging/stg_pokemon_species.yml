models:
  - name: stg_pokemon_species
    description: >-
      One row per Pokémon species (latest fetch): descriptive attributes such as flavour text,
      genus, colour, habitat, legendary/mythical/baby flags and the evolution parent.
    columns:
      - name: fetch_date
        data_type: TIMESTAMP
        description: '{{ doc("fetch_date") }}'
        tests:
          - not_null
      - name: poke_id
        data_type: INTEGER
        description: '{{ doc("poke_id") }}'
        tests:
          - unique
          - not_null
      - name: poke_description
        data_type: VARCHAR
        description: '{{ doc("poke_description") }}'
      - name: genus
        data_type: VARCHAR
        description: '{{ doc("genus") }}'
      - name: is_legendary
        data_type: BOOLEAN
        description: '{{ doc("is_legendary") }}'
        tests:
          - not_null
      - name: is_mythical
        data_type: BOOLEAN
        description: '{{ doc("is_mythical") }}'
        tests:
          - not_null
      - name: is_baby
        data_type: BOOLEAN
        description: '{{ doc("is_baby") }}'
        tests:
          - not_null
      - name: color
        data_type: VARCHAR
        description: '{{ doc("color") }}'
      - name: habitat
        data_type: VARCHAR
        description: '{{ doc("habitat") }}'
      - name: evolves_from_name
        data_type: VARCHAR
        description: '{{ doc("evolves_from_name") }}'
      - name: evolves_from_id
        data_type: INTEGER
        description: '{{ doc("evolves_from_id") }}'
sources: []
seeds: []
