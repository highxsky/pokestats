models:
  - name: stg_pokemons
    columns:
      - name: fetch_date
        data_type: TIMESTAMP
        description: '{{ doc("fetch_date") }}'
        tests:
          - not_null
      - name: poke_id
        data_type: INTEGER
        description: '{{ doc("poke_id") }}'
        tests:
          - not_null
          - unique
      - name: poke_name
        data_type: VARCHAR
        description: '{{ doc("poke_name") }}'
        tests:
          - not_null
      - name: height
        data_type: DOUBLE
        description: '{{ doc("height") }}'
        tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: weight
        data_type: DOUBLE
        description: '{{ doc("weight") }}'
        tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 10000
sources: []
seeds: []