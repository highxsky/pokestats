models:
  - name: stg_version_groups
    description: >-
      One row per (version group, version) pair, linking each game version to its
      version group and the generation it belongs to.
    columns:
      - name: fetch_date
        data_type: TIMESTAMP
        description: '{{ doc("fetch_date") }}'
        tests:
          - not_null
      - name: version_group_id
        data_type: INTEGER
        description: '{{ doc("version_group_id") }}'
        tests:
          - not_null
      - name: version_group_name
        data_type: VARCHAR
        description: '{{ doc("version_group_name") }}'
        tests:
          - not_null
      - name: gen_id
        data_type: INTEGER
        description: '{{ doc("gen_id") }}'
        tests:
          - not_null
      - name: version_id
        data_type: INTEGER
        description: '{{ doc("version_id") }}'
        tests:
          - not_null
      - name: version_name
        data_type: VARCHAR
        description: '{{ doc("version_name") }}'
        tests:
          - not_null
sources: []
seeds: []
